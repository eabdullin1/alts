---
use_ssl: false
ssl_config:
  security_cert_store: "/etc/ssl/certs/*.crt"
  security_key: ""
  security_certificate: ""
  broker_ca_certificates: ""
  security_digest: "sha256"
broker_config:
  use_ssl: false
  rabbitmq_host: "rabbitmq"
  rabbitmq_port: 5672
  rabbitmq_ssl_port: 5671
  rabbitmq_user: "user"
  rabbitmq_password: "password"
  rabbitmq_vhost: "test_system"
results_backend_config:
  s3_access_key_id: ""
  s3_secret_access_key: ""
  s3_bucket: ""
  s3_base_path: 'celery_result_backend/'
  s3_region: ""
  s3_endpoint_url: ""
  azureblockblob_container_name: ""
  azureblockblob_base_path: ""
  azure_connection_string: "blockblob://"
s3_access_key_id: ""
s3_secret_access_key: ""
s3_bucket: ""
s3_base_path: 'celery_result_backend/'
s3_region: ""
s3_endpoint_url: ""
azureblockblob_container_name: ""
azureblockblob_base_path: ""
azure_connection_string: "blockblob://"
task_default_queue: "default"
task_acks_late: true
task_track_started: true
artifacts_root_directory: "test_system_artifacts"
worker_prefetch_multiplier: 1
testing: true
working_directory: "/tmp"
jwt_secret: "secret"
hashing_algorithm: "HS256"
opennebula_rpc_endpoint: ""
opennebula_username: ""
opennebula_password: ""
opennebula_vm_group: ""
opennebula_network: ""
bs_host: "http://web_server:8000"
bs_token: "token"
# Images of the docker environments, the only source of them: full names
# with tags by "<dist_name>-<dist_version>" of the task (or
# "<dist_name>-<dist_version>-<dist_arch>" for one architecture).
# Only init images (systemd as PID 1): every docker container is an init
# container. Every platform AlmaLinux init images serve (x86_64, x86_64_v2
# for 10, i686, aarch64, ppc64le, s390x) is in the same tag.
docker_images:
  almalinux-8: "almalinux/8-init:8"
  almalinux-9: "almalinux/9-init:9"
  almalinux-10: "almalinux/10-init:10"
  almalinux-10-kitten: "almalinux/10-kitten-init:10-kitten"
logs_uploader_config:
  pulp_host: "http://pulp"
  pulp_user: "user"
  pulp_password: "password"
  azure_logs_container: "testsys-mqdata"
